
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт на Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

  <!-- Меню -->
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Мой сайт</a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav">
          <a class="nav-link" href="#home">Главная</a>
          <a class="nav-link" href="#cards">Карточки</a>
          <a class="nav-link" href="#contact">Контакты</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Заголовок -->
  <header class="container text-center p-3 my-3" id="home">
    <h1>Добро пожаловать!</h1>
    <p>Bootstrap 5</p>
    <button class="btn btn-primary" data-bs-toggle="modal"
      data-bs-target="#infoModal">
      Подробнее
    </button>
  </header>

  <!-- Карточки -->
  <section class="container my-5" id="cards">
    <h2 class="text-center mb-4">Наши возможности</h2>

    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 p-3">
          <div class="card-body text-center">
            <i class="bi bi-laptop fs-1 text-primary"></i>
            <h5 class="card-title">Разработка</h5>
            <p class="card-text">Создание простых сайтов.</p>
            <button class="btn btn-outline-primary"
              data-bs-toggle="modal" data-bs-target="#infoModal">
              Подробнее
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 p-3">
          <div class="card-body text-center">
            <i class="bi bi-palette fs-1 text-primary"></i>
            <h5 class="card-title">Дизайн</h5>
            <p class="card-text">Красивое оформление страниц.</p>
            <button class="btn btn-outline-primary"
              data-bs-toggle="modal" data-bs-target="#infoModal">
              Подробнее
            </button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 p-3">
          <div class="card-body text-center">
            <i class="bi bi-phone fs-1 text-primary"></i>
            <h5 class="card-title">Адаптивность</h5>
            <p class="card-text">Сайт работает на разных экранах.</p>
            <button class="btn btn-outline-primary"
              data-bs-toggle="modal" data-bs-target="#infoModal">
              Подробнее
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Форма -->
  <section class="container my-5" id="contact">
    <h2 class="text-center mb-4">Обратная связь</h2>
    <form id="contactForm" class="col-12 col-md-8 col-lg-6 mx-auto">
      <div class="mb-3">
        <label class="form-label">Имя</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Сообщение</label>
        <textarea class="form-control" rows="3" required></textarea>
      </div>

      <button type="submit" class="btn btn-success">
        <i class="bi bi-send"></i> Отправить
      </button>
      <p id="result" class="text-success mt-3"></p>
    </form>
  </section>

  <!-- Модальное окно -->
  <div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Информация</h5>
          <button type="button" class="btn-close"
            data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          чота да чота
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary"
            data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Подвал -->
  <footer class="container-fluid bg-dark text-white text-center p-3">
    <p class="m-3">2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('result').textContent =
        'Форма успешно заполнена!';
      this.reset();
    });
  </script>

</body>
</html>
